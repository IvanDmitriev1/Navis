name: Publish Navis.WinUI

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Navis.slnx

      - name: Build
        run: dotnet build Navis.slnx --configuration Release --no-restore --nologo

      - name: Pack
        run: dotnet pack src\Navis.WinUI\Navis.WinUI.csproj --configuration Release --no-build --output artifacts\packages

      - name: Publish package
        run: dotnet nuget push artifacts\packages\*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate